[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["venv", "venv_new", ".venv", "build", "dist", "payloads"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "S"]
ignore = [
    "S101",
    "S603",
    "S607",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"rat_client.py" = ["S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --cov=. --cov-report=term --cov-report=xml"